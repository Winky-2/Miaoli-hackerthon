function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];

	getModuleCount : function() {

	make : function() {
		// Calculate automatically typeNumber if provided is < 1

			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

<body>
<!-- 印泥質感：讓蓋章的邊緣有一點不規則 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
</svg>
<div id="demoBar" class="demo-bar hidden"></div>
<div id="app"><div class="loading">載入中…</div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
/* ================================================================
   示範模式用的關卡（正式模式改讀試算表「關卡」工作表）
   ================================================================ */
const DEMO_STATIONS = [
  {id:'S1',module:'客語',title:'聽音辨義',type:'quiz',prompt:'聽聽看，這句客語是什麼意思？',options:['謝謝你','吃飽了沒？','早安','再見'],answer:'1',points:10,audio:'audio/s1.mp3',hint:'食飽吂？'},
  {id:'S2',module:'農產',title:'產季快問快答',type:'quiz',prompt:'公館紅棗的盛產期大約在什麼時候？',options:['3月–4月','7月中–8月下旬','11月–12月','一年四季都有'],answer:'1',points:10,audio:'',hint:''},
  {id:'S3',module:'文化',title:'擂茶 DIY',type:'task',prompt:'跟著關主把芝麻、花生和茶葉擂成粉，完成一碗擂茶後，請關主輸入確認碼。',options:[],answer:'1111',points:10,audio:'',hint:''},
  {id:'S4',module:'導流',title:'合作店家打卡',type:'task',prompt:'到市集周邊的合作店家消費或拍照打卡，請店員輸入確認碼。',options:[],answer:'2222',points:10,audio:'',hint:''},
];
const DEMO_VENDORS = [{id:'V1',name:'草莓小農'},{id:'V2',name:'紅棗攤'},{id:'V3',name:'藍染工作室'}];
const DEMO_VENDOR_PIN = '0000';
const SEASONS = ['春','夏','秋','冬'];
const CITIES = ['苗栗縣','台中市','新竹縣','新竹市','桃園市','台北市','新北市','基隆市','宜蘭縣','彰化縣','南投縣','雲林縣','嘉義縣','嘉義市','台南市','高雄市','屏東縣','花蓮縣','台東縣','澎湖縣','金門縣','連江縣','國外'];
const AGES = ['18以下','19-29','30-44','45-64','65以上'];
const PARTY = ['1','2','3','4','5人以上'];
const CATEGORIES = ['農產品','加工品','文創','餐飲'];
const BANDS = ['100以下','100-299','300-499','500以上'];

/* ================================================================
   示範用的本機後端（邏輯與 Code.gs 相同）
   ================================================================ */
const Mock = (() => {
  const KEY = 'hm_mock_v1';
  let db = null;
  const store = {
    get(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } },
    set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} },
    clear(){ try{ localStorage.removeItem(KEY); }catch(e){} },
  };
  const ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function code(){ let c; do{ c=''; for(let i=0;i<6;i++) c+=ABC[Math.floor(Math.random()*ABC.length)]; }while(Object.values(db.users).some(u=>u.code===c)); return c; }
  function load(){
    if(db) return db;
    db = store.get();
    if(!db){ db = {users:{},logs:[],red:[]}; seed(); store.set(db); }
    return db;
  }
  function seed(){
    const cities=['台中市','新竹縣','桃園市','台北市','苗栗縣','新北市'];
    for(let i=0;i<30;i++){
      const uid='demo_'+i, k=1+(i*7)%DEMO_STATIONS.length;
      const earned=DEMO_STATIONS.slice(0,k).reduce((a,s)=>a+s.points,0);
      const used=i%3===0?0:Math.min(earned,10*(1+i%3));
      db.users[uid]={userId:uid,code:code(),points:earned-used,earned,city:cities[i%6],age:AGES[(i*3)%5],party:String(1+i%4),consentAt:1};
      DEMO_STATIONS.slice(0,k).forEach(s=>db.logs.push({userId:uid,stationId:s.id,correct:true,points:s.points}));
      if(used) db.red.push({code:'',userId:uid,vendorId:DEMO_VENDORS[i%3].id,category:'農產品',band:BANDS[i%4],points:used});
    }
  }
  const pub = u => ({code:u.code,points:u.points,consented:!!u.consentAt});
  const done = uid => [...new Set(db.logs.filter(l=>l.userId===uid&&l.correct).map(l=>l.stationId))];
  const st = (id,type) => { const s=DEMO_STATIONS.find(x=>x.id===id); if(!s) throw new Error('找不到關卡：'+id); if(s.type!==type) throw new Error('關卡類型不符'); return s; };
  const user = uid => { const u=db.users[uid]; if(!u) throw new Error('找不到玩家，請重新開啟頁面'); return u; };
  const byCode = c => { c=String(c||'').trim().toUpperCase(); const u=Object.values(db.users).find(x=>x.code===c); if(!u) throw new Error('查無此點數碼：'+c); return u; };
  const vpin = r => { if(String(r.vendorPin||'')!==DEMO_VENDOR_PIN) throw new Error('攤商登入碼錯誤'); };
  const stationsPub = () => DEMO_STATIONS.map(({answer,...s})=>s);
  const award = (u,s,ok) => {
    const pts = ok?s.points:0;
    db.logs.push({userId:u.userId,stationId:s.id,correct:ok,points:pts});
    if(ok){ u.points+=pts; u.earned+=pts; }
    return {correct:ok,gained:pts,user:pub(u),done:done(u.userId)};
  };
  const countBy = (arr,k) => { const m={}; arr.forEach(o=>{ const v=String(o[k]||'').trim(); if(v) m[v]=(m[v]||0)+1; }); return Object.entries(m).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value); };
  const A = {
    init(r){ if(!r.userId) throw new Error('缺少玩家身分'); if(!db.users[r.userId]) db.users[r.userId]={userId:r.userId,code:code(),points:0,earned:0}; return {user:pub(db.users[r.userId]),done:done(r.userId),stations:stationsPub()}; },
    stations(){ return {stations:stationsPub()}; },
    consent(r){ const u=user(r.userId); Object.assign(u,{city:r.city||'',age:r.age||'',party:r.party||'',consentAt:Date.now()}); return {user:pub(u)}; },
    answer(r){ const u=user(r.userId), s=st(r.stationId,'quiz'); if(done(u.userId).includes(s.id)) return {already:true,user:pub(u)}; return award(u,s,String(r.choice)===s.answer); },
    confirm(r){ const u=user(r.userId), s=st(r.stationId,'task'); if(done(u.userId).includes(s.id)) return {already:true,user:pub(u)}; if(String(r.pin||'').trim()!==s.answer) return {correct:false,user:pub(u)}; return award(u,s,true); },
    vendorLogin(r){ vpin(r); return {vendors:DEMO_VENDORS}; },
    lookup(r){ vpin(r); const u=byCode(r.code); return {code:u.code,points:u.points}; },
    redeem(r){ vpin(r); const u=byCode(r.code), p=Math.floor(Number(r.points)); if(!(p>0)) throw new Error('折抵點數要大於 0'); if(p>u.points) throw new Error('點數不足，目前只有 '+u.points+' 點'); u.points-=p; db.red.push({code:u.code,userId:u.userId,vendorId:r.vendorId,category:r.category,band:r.band,points:p}); return {code:u.code,used:p,points:u.points}; },
    stats(){
      const users=Object.values(db.users), n=users.length, ok=db.logs.filter(l=>l.correct);
      const by={}; ok.forEach(l=>{ (by[l.userId]=by[l.userId]||{})[l.stationId]=1; });
      const finished=users.filter(u=>Object.keys(by[u.userId]||{}).length>=CONFIG.DONE_FOR_STAMP).length;
      const issued=users.reduce((a,u)=>a+(u.earned||0),0), used=db.red.reduce((a,r)=>a+r.points,0);
      return {players:n,demoPlayers:users.filter(u=>u.userId.startsWith('demo_')).length,finished,completionRate:n?finished/n:0,issued,used,redeemRate:issued?used/issued:0,redemptions:db.red.length,
        byStation:DEMO_STATIONS.map(s=>({label:s.module+'・'+s.title,value:users.filter(u=>(by[u.userId]||{})[s.id]).length})),
        byVendor:DEMO_VENDORS.map(v=>({label:v.name,value:db.red.filter(r=>r.vendorId===v.id).length})),
        byCity:countBy(users,'city'),byAge:countBy(users,'age'),byBand:countBy(db.red,'band'),updatedAt:new Date().toISOString()};
    },
  };
  return {
    async call(req){
      await new Promise(r=>setTimeout(r,200));
      const fresh = store.get();               // 每次重讀，讓同一台裝置的多個分頁同步
      if(fresh) db = fresh; else load();       // 瀏覽器不給存時，改用記憶體
      try{ const out=A[req.action](req); store.set(db); return {ok:true,...out}; }
      catch(e){ return {ok:false,error:e.message}; }
    },
    reset(){ store.clear(); db=null; },
  };
})();

/* ================================================================
   共用工具
   ================================================================ */
const $app = document.getElementById('app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const SS = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} },
};

function readParams(){
  const p = new URLSearchParams(location.search);
  const st = p.get('liff.state');          // 從 liff.line.me 進來時，參數會包在 liff.state 裡
  if(st){
    const q = st.includes('?') ? st.slice(st.indexOf('?')+1) : '';
    new URLSearchParams(q).forEach((v,k)=>{ if(!p.has(k)) p.set(k,v); });
  }
  return p;
}

let toastTimer;
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast'+(isErr?' err':'');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.add('hidden'), 2600);
}

async function api(action, data={}){
  const body = {action, ...data};
  let res;
  if(CONFIG.GAS_URL){
    try{
      const r = await fetch(CONFIG.GAS_URL, {method:'POST', body:JSON.stringify(body)});
      res = await r.json();
    }catch(e){ throw new Error('連不上伺服器，請確認網路後再試一次'); }
  }else{
    res = await Mock.call(body);
  }
  if(!res.ok) throw new Error(res.error || '發生錯誤，請再試一次');
  return res;
}

function drawQR(el, text, size){
  const qr = new QRCore.QRCode(-1, QRCore.ECL.M);
  qr.addData(text); qr.make();
  const n = qr.getModuleCount(), quiet = 4, total = n + quiet*2;
  const scale = Math.max(4, Math.ceil(size*2/total));
  const c = document.createElement('canvas');
  c.width = c.height = total*scale;
  c.style.width = c.style.height = size+'px';
  c.setAttribute('role','img'); c.setAttribute('aria-label','QR Code');
  const g = c.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle = '#1C2F4D';
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(qr.isDark(r,k)) g.fillRect((k+quiet)*scale,(r+quiet)*scale,scale,scale);
  el.innerHTML = ''; el.appendChild(c);
}

function stationUrl(id){
  if(CONFIG.LIFF_ID) return 'https://liff.line.me/'+CONFIG.LIFF_ID+'?s='+encodeURIComponent(id);
  return location.origin + location.pathname + '?s=' + encodeURIComponent(id);
}
function modeUrl(mode){
  if(CONFIG.LIFF_ID) return 'https://liff.line.me/'+CONFIG.LIFF_ID+'?mode='+mode;
  return location.origin + location.pathname + '?mode=' + mode;
}

function loadLiff(){
  return new Promise((ok,fail)=>{
    if(window.liff) return ok();
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = ok; s.onerror = ()=>fail(new Error('LINE 元件載入失敗，請檢查網路'));
    document.head.appendChild(s);
  });
}
const canScan = () => !!(window.liff && liff.isInClient && liff.isInClient() && liff.isApiAvailable && liff.isApiAvailable('scanCodeV2'));

function header(sub, backFn){
  return `<header class="top"><div class="in">
    ${backFn ? `<button class="back" data-back>‹ 返回</button>` : `<div class="brand">客庄玩市集</div>`}
    <div class="event">${esc(sub||CONFIG.EVENT_NAME)}</div></div></header>`;
}

/* ================================================================
   玩家端
   ================================================================ */
const P = { uid:null, user:null, done:[], stations:[], pending:null, justStamped:false };

async function bootPlayer(params){
  if(CONFIG.LIFF_ID){
    await loadLiff();
    await liff.init({liffId:CONFIG.LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
    const prof = await liff.getProfile();      // 只用 userId，不儲存暱稱與大頭貼
    P.uid = prof.userId;
    params = readParams();
  }else{
    P.uid = LS.get('hm_local_uid') || ('local_'+Math.random().toString(36).slice(2,10));
    LS.set('hm_local_uid', P.uid);
  }
  P.pending = params.get('s');
  const r = await api('init', {userId:P.uid});
  Object.assign(P, {user:r.user, done:r.done, stations:r.stations});
  route();
}

function route(){
  if(!P.user.consented) return viewConsent();
  if(P.pending){
    const id = P.pending; P.pending = null;
    const s = P.stations.find(x=>x.id===id);
    if(!s) toast('找不到這個關卡，請再掃一次', true);
    else if(P.done.includes(id)) toast('「'+s.title+'」已經完成過了');
    else return viewStation(s);
  }
  viewHome();
}

function viewConsent(){
  const opt = (arr) => '<option value="">略過</option>'+arr.map(v=>`<option>${esc(v)}</option>`).join('');
  $app.innerHTML = header() + `<main class="wrap"><section class="sheet">
    <h2>開始闖關前</h2>
    <p>我們只記錄闖關與兌換紀錄，用來改善下一場市集。不蒐集姓名、電話，分析時只使用去識別化的統計資料。</p>
    <p class="muted">以下問題自由填寫，可以略過。</p>
    <label class="field"><span>你住在哪裡</span><select id="c-city">${opt(CITIES)}</select></label>
    <label class="field"><span>年齡</span><select id="c-age">${opt(AGES)}</select></label>
    <label class="field"><span>今天幾個人一起來</span><select id="c-party">${opt(PARTY)}</select></label>
    <p style="margin-top:22px"><button class="btn" id="c-go">同意並開始闖關</button></p>
  </section></main>`;
  document.getElementById('c-go').onclick = async (e) => {
    e.target.disabled = true;
    try{
      const r = await api('consent', {userId:P.uid, city:val('c-city'), age:val('c-age'), party:val('c-party')});
      P.user = r.user; route();
    }catch(err){ toast(err.message,true); e.target.disabled=false; }
  };
}
const val = id => document.getElementById(id).value;

function viewHome(){
  const n = P.done.length, need = Math.max(0, CONFIG.DONE_FOR_STAMP - n);
  const stamped = need === 0;
  const seals = SEASONS.map(s=>{
    const cur = s===CONFIG.SEASON;
    const cls = cur && stamped ? 'seal on'+(P.justStamped?' thunk':'') : cur ? 'seal now' : 'seal';
    return `<div class="${cls}" aria-label="${s}季章${cur&&stamped?'（已蓋章）':''}">${s}</div>`;
  }).join('');
  P.justStamped = false;
  const rows = P.stations.map(s=>{
    const isDone = P.done.includes(s.id);
    const right = isDone ? `<span class="mark">完成</span>`
      : CONFIG.ALLOW_TAP_STATION ? `<button class="btn small ghost" data-go="${esc(s.id)}">開始</button>` : '';
    return `<li class="st"><div class="info"><span class="tag">${esc(s.module)}</span>
      <div class="name">${esc(s.title)}</div><div class="pts">${s.points} 點</div></div>${right}</li>`;
  }).join('');
  const msg = stamped ? `已蓋上本場的${CONFIG.SEASON}季章，集滿四季可兌換在地農產禮盒`
    : `再完成 ${need} 關，就能蓋上${CONFIG.SEASON}季章`;
  $app.innerHTML = header() + `<main class="wrap">
    <section class="sheet">
      <div class="pass-head"><div><h2>貓貍四季護照</h2><div class="muted">${esc(msg)}</div></div>
      <div class="points" aria-label="目前點數">${P.user.points}<small>點</small></div></div>
      <div class="seals">${seals}</div>
    </section>
    <section class="sheet">
      <h2>今天的關卡</h2>
      <div class="muted">${CONFIG.ALLOW_TAP_STATION ? '到關卡掃 QR Code，或直接點開始' : '到各關卡現場掃 QR Code 開始'}</div>
      <ul class="stations">${rows}</ul>
    </section>
    ${CONFIG.GAS_URL ? '' : `<p style="text-align:center"><button class="btn small ghost" id="reset">清除示範資料</button></p>`}
  </main>
  <div class="dock"><div class="in">
    ${canScan() ? `<button class="btn ghost" id="scan">掃關卡</button>` : ''}
    <button class="btn" id="mycode">出示點數碼</button>
  </div></div>`;
  $app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>viewStation(P.stations.find(s=>s.id===b.dataset.go)));
  document.getElementById('mycode').onclick = viewCode;
  const sc = document.getElementById('scan');
  if(sc) sc.onclick = async ()=>{
    try{
      const r = await liff.scanCodeV2();
      const m = String(r.value||'').match(/[?&]s=([^&#]+)/);
      if(!m) return toast('這不是關卡的 QR Code', true);
      P.pending = decodeURIComponent(m[1]); route();
    }catch(e){ /* 使用者取消掃描 */ }
  };
  const rs = document.getElementById('reset');
  if(rs) rs.onclick = ()=>{ if(confirm('清除這台裝置上的示範資料？')){ Mock.reset(); LS.del('hm_local_uid'); location.reload(); } };
}

function viewStation(s){
  const quiz = s.type==='quiz';
  $app.innerHTML = header(s.module+'關卡', true) + `<main class="wrap"><section class="sheet">
    <span class="tag">${esc(s.module)}</span>
    <h2 style="margin-top:6px">${esc(s.title)}</h2>
    <p class="prompt">${esc(s.prompt)}</p>
    <div id="body">
    ${quiz ? `
      ${s.audio ? `<button class="play" id="play"><i></i><span>播放客語</span></button><audio id="au" preload="auto" src="${esc(s.audio)}"></audio>` : ''}
      <div class="opts">${s.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    : `
      <label class="field"><span>關主確認碼</span>
        <input id="pin" class="pin" inputmode="numeric" autocomplete="off" maxlength="8"></label>
      <p style="margin-top:18px"><button class="btn" id="ok">確認完成</button></p>`}
    </div>
  </section></main>`;
  $app.querySelector('[data-back]').onclick = viewHome;

  if(quiz){
    const au = document.getElementById('au'), pl = document.getElementById('play');
    if(au){
      au.onerror = ()=>{ pl.querySelector('span').textContent = s.hint ? '音檔尚未放入，文字版：'+s.hint : '音檔尚未放入'; };
      au.onended = ()=>pl.classList.remove('on');
      pl.onclick = ()=>{ if(au.paused){ au.currentTime=0; au.play().then(()=>pl.classList.add('on')).catch(()=>au.onerror()); } else { au.pause(); pl.classList.remove('on'); } };
    }
    $app.querySelectorAll('.opt').forEach(b=>b.onclick = async ()=>{
      $app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      try{
        const r = await api('answer', {userId:P.uid, stationId:s.id, choice:b.dataset.i});
        if(r.already) return afterAlready(s);
        if(r.correct) return afterWin(s, r);
        b.classList.add('wrong'); toast('不對喔，再試一次');
      }catch(e){ toast(e.message,true); }
      $app.querySelectorAll('.opt').forEach(x=>x.disabled=false);
    });
  }else{
    const ok = document.getElementById('ok'), pin = document.getElementById('pin');
    pin.onkeydown = e=>{ if(e.key==='Enter') ok.click(); };
    ok.onclick = async ()=>{
      if(!pin.value.trim()) return toast('請關主輸入確認碼', true);
      ok.disabled = true;
      try{
        const r = await api('confirm', {userId:P.uid, stationId:s.id, pin:pin.value});
        if(r.already) return afterAlready(s);
        if(r.correct) return afterWin(s, r);
        toast('確認碼不對，請關主再輸入一次', true); pin.value=''; pin.focus();
      }catch(e){ toast(e.message,true); }
      ok.disabled = false;
    };
  }
}

function afterAlready(s){ toast('「'+s.title+'」已經完成過了'); refresh().then(viewHome); }

function afterWin(s, r){
  const before = P.done.length;
  P.user = r.user; P.done = r.done;
  P.justStamped = before < CONFIG.DONE_FOR_STAMP && P.done.length >= CONFIG.DONE_FOR_STAMP;
  document.getElementById('body').innerHTML = `<div class="result">
    <div class="seal on thunk">${esc(s.module)}</div>
    <div class="big">過關！＋${r.gained} 點</div>
    <p class="muted">目前共 ${P.user.points} 點，可以到攤位折抵消費</p>
    <button class="btn" id="home">回到護照</button></div>`;
  document.getElementById('home').onclick = viewHome;
}

async function refresh(){
  const r = await api('init', {userId:P.uid});
  Object.assign(P, {user:r.user, done:r.done, stations:r.stations});
}

function viewCode(){
  $app.innerHTML = header('我的點數碼', true) + `<main class="wrap"><section class="sheet" style="text-align:center">
    <h2>給攤商掃描折抵</h2>
    <div class="qrbox" id="qr"></div>
    <div class="code" aria-label="點數碼">${esc(P.user.code)}</div>
    <p class="muted">掃不到時，請攤商輸入上面這 6 個字</p>
    <div class="balance"><span>目前點數</span><b class="points" style="font-size:30px" id="bal">${P.user.points}<small>點</small></b></div>
    <p style="margin-top:16px"><button class="btn ghost" id="upd">折抵後更新點數</button></p>
  </section></main>`;
  drawQR(document.getElementById('qr'), 'HM:'+P.user.code, 220);
  $app.querySelector('[data-back]').onclick = viewHome;
  document.getElementById('upd').onclick = async ()=>{
    try{ await refresh(); document.getElementById('bal').innerHTML = P.user.points+'<small>點</small>'; toast('點數已更新'); }
    catch(e){ toast(e.message,true); }
  };
}

/* ================================================================
   攤商端（?mode=vendor）
   ================================================================ */
const V = { pin:null, vendors:[], vendorId:null, code:null, points:0, cat:CATEGORIES[0], band:BANDS[0], use:10 };

async function bootVendor(){
  if(CONFIG.LIFF_ID){ try{ await loadLiff(); await liff.init({liffId:CONFIG.LIFF_ID}); }catch(e){ /* 不在 LINE 裡也能手動輸入 */ } }
  V.pin = SS.get('hm_vpin');
  if(V.pin){ try{ V.vendors = (await api('vendorLogin',{vendorPin:V.pin})).vendors; }catch(e){ V.pin=null; } }
  V.pin ? vendorMain() : vendorLogin();
}

function vendorLogin(){
  $app.innerHTML = header('攤商核銷') + `<main class="wrap"><section class="sheet">
    <h2>攤商登入</h2><p class="muted">請輸入主辦單位提供的攤商登入碼</p>
    <label class="field"><span>攤商登入碼</span><input id="vp" class="pin" inputmode="numeric" autocomplete="off"></label>
    <p style="margin-top:18px"><button class="btn" id="vgo">登入</button></p></section></main>`;
  const go = document.getElementById('vgo'), inp = document.getElementById('vp');
  inp.onkeydown = e=>{ if(e.key==='Enter') go.click(); };
  go.onclick = async ()=>{
    go.disabled = true;
    try{ V.vendors = (await api('vendorLogin',{vendorPin:inp.value.trim()})).vendors; V.pin = inp.value.trim(); SS.set('hm_vpin',V.pin); vendorMain(); }
    catch(e){ toast(e.message,true); go.disabled=false; }
  };
}

function vendorMain(){
  V.vendorId = LS.get('hm_vendor') || (V.vendors[0]||{}).id;
  V.code = null;
  $app.innerHTML = header('攤商核銷') + `<main class="wrap">
    <section class="sheet">
      <label class="field" style="margin-top:0"><span>我的攤位</span>
        <select id="vs">${V.vendors.map(v=>`<option value="${esc(v.id)}"${v.id===V.vendorId?' selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
      ${canScan() ? `<p style="margin-top:16px"><button class="btn" id="vscan">掃描客人的點數碼</button></p>` : ''}
      <label class="field"><span>${canScan()?'或手動輸入點數碼':'輸入客人的點數碼'}</span>
        <div class="row"><input id="vc" maxlength="6" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em">
        <button class="btn small" id="vlook">查詢</button></div></label>
    </section>
    <section class="sheet hidden" id="vform"></section>
  </main>`;
  document.getElementById('vs').onchange = e=>{ V.vendorId=e.target.value; LS.set('hm_vendor',V.vendorId); };
  const look = document.getElementById('vlook'), inp = document.getElementById('vc');
  inp.onkeydown = e=>{ if(e.key==='Enter') look.click(); };
  look.onclick = ()=>vendorLookup(inp.value);
  const sc = document.getElementById('vscan');
  if(sc) sc.onclick = async ()=>{ try{ const r=await liff.scanCodeV2(); vendorLookup(String(r.value||'')); }catch(e){} };
}

async function vendorLookup(raw){
  const code = String(raw).trim().toUpperCase().replace(/^HM:/,'');
  if(code.length!==6) return toast('點數碼是 6 個字', true);
  try{
    const r = await api('lookup',{vendorPin:V.pin, code});
    Object.assign(V,{code:r.code, points:r.points, use:Math.min(10,r.points)});
    vendorForm();
  }catch(e){ toast(e.message,true); }
}

function vendorForm(){
  const f = document.getElementById('vform'); f.classList.remove('hidden');
  const chips = (arr,key) => arr.map(v=>`<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${V[key]===v}">${esc(v)}</button>`).join('');
  f.innerHTML = `<div class="balance" style="margin-top:0"><span>點數碼 <b>${esc(V.code)}</b></span><b class="points" style="font-size:30px">${V.points}<small>點</small></b></div>
    <div class="field"><span>品項類別</span><div class="chips">${chips(CATEGORIES,'cat')}</div></div>
    <div class="field"><span>消費金額</span><div class="chips">${chips(BANDS,'band')}</div></div>
    <div class="field"><span>折抵點數（1 點折 1 元，由攤位自訂）</span>
      <div class="stepper"><button id="dn" aria-label="減少">−</button><output id="use">${V.use}</output><button id="up" aria-label="增加">＋</button></div></div>
    <p style="margin-top:18px"><button class="btn" id="vok"${V.points<=0?' disabled':''}>確認折抵 ${V.use} 點</button></p>
    ${V.points<=0?'<p class="muted">這位客人目前沒有點數</p>':''}`;
  f.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ V[c.dataset.k]=c.dataset.v; vendorForm(); });
  const set = n => { V.use = Math.max(1, Math.min(V.points, n)); vendorForm(); };
  document.getElementById('dn').onclick = ()=>set(V.use-5);
  document.getElementById('up').onclick = ()=>set(V.use+5);
  document.getElementById('vok').onclick = async (e)=>{
    e.target.disabled = true;
    try{
      const r = await api('redeem',{vendorPin:V.pin, code:V.code, vendorId:V.vendorId, category:V.cat, band:V.band, points:V.use});
      f.innerHTML = `<div class="result"><div class="seal on thunk">折</div>
        <div class="big">已折抵 ${r.used} 點</div><p class="muted">客人剩 ${r.points} 點${r.notified?'，已用 LINE 通知客人':''}</p>
        <button class="btn" id="next">下一位</button></div>`;
      document.getElementById('next').onclick = vendorMain;
    }catch(err){ toast(err.message,true); e.target.disabled=false; }
  };
}

/* ================================================================
   即時數據（?mode=stats，給攤位螢幕投影）
   ================================================================ */
async function bootStats(){
  document.body.className = 'stats';
  const pct = x => Math.round(x*100)+'%';
  const bars = (arr) => {
    if(!arr.length) return '<p style="opacity:.6">還沒有資料</p>';
    const max = Math.max(1,...arr.map(a=>a.value));
    return arr.slice(0,6).map(a=>`<div class="bar"><span class="lab">${esc(a.label)}</span>
      <span class="track"><span class="fill" style="width:${a.value/max*100}%"></span></span><span class="n">${a.value}</span></div>`).join('');
  };
  async function tick(){
    try{
      const s = await api('stats');
      $app.innerHTML = `<div class="stats-wrap">
        <div class="stats-head"><h1>客庄玩市集 即時數據</h1><span>${esc(CONFIG.EVENT_NAME)}　更新於 ${new Date(s.updatedAt).toLocaleTimeString('zh-TW',{hour12:false})}</span></div>
        <div class="kpis">
          <div class="kpi"><div class="v">${s.players}</div><div class="l">參與人數</div><div class="t">每場目標 1000–1500 人</div></div>
          <div class="kpi"><div class="v">${pct(s.completionRate)}</div><div class="l">闖關完成率</div><div class="t${s.completionRate>=.5?' hit':''}">完成 ${CONFIG.DONE_FOR_STAMP} 關以上｜目標 ≥ 50%</div></div>
          <div class="kpi"><div class="v">${pct(s.redeemRate)}</div><div class="l">點數兌換率</div><div class="t${s.redeemRate>=.6?' hit':''}">已兌換 ${s.used}／發出 ${s.issued} 點｜目標 ≥ 60%</div></div>
          <div class="kpi"><div class="v">${s.redemptions}</div><div class="l">攤位兌換筆數</div><div class="t">點數直接轉成攤位營收</div></div>
        </div>
        <div class="panels">
          <div class="panel"><h3>各關卡完成人數</h3>${bars(s.byStation)}</div>
          <div class="panel"><h3>各攤位兌換次數</h3>${bars(s.byVendor)}</div>
          <div class="panel"><h3>遊客居住縣市</h3>${bars(s.byCity)}</div>
        </div>
        <p class="note">${s.demoPlayers ? `其中 ${s.demoPlayers} 人為模擬資料，其餘為現場即時資料。` : '全部為現場即時資料。'}資料去識別化，不含姓名與電話。</p>
      </div>`;
    }catch(e){ toast(e.message,true); }
  }
  await tick(); setInterval(tick, 8000);
}

/* ================================================================
   QR 卡片（?mode=qr，列印用）
   ================================================================ */
async function bootQR(){
  document.body.className = 'qr';
  let stations = DEMO_STATIONS;
  try{ stations = (await api('stations')).stations; }catch(e){ toast(e.message,true); }
  const cards = stations.map(s=>({t:s.title, sub:s.module+'關卡', h:'用 LINE 掃描開始闖關', url:stationUrl(s.id)}))
    .concat([{t:'攤商核銷', sub:'攤商專用', h:'攤商用 LINE 掃描，登入後核銷點數', url:modeUrl('vendor')},
             {t:'即時數據', sub:'攤位投影', h:'用電腦開啟此網址投影', url:modeUrl('stats')}]);
  $app.innerHTML = `<div class="qr-wrap">
    <div class="noprint">
      <h2>QR Code 卡片</h2>
      ${CONFIG.LIFF_ID ? '' : '<p class="warn">尚未設定 LIFF_ID，下面的 QR Code 會連到目前這個網址（示範用）。設定後重新整理即可。</p>'}
      <p><button class="btn small" onclick="print()">列印</button></p>
    </div>
    <div class="cards">${cards.map((c,i)=>`<div class="card"><span class="tag">${esc(c.sub)}</span>
      <div class="t">${esc(c.t)}</div><div class="q" id="q${i}"></div><div class="h">${esc(c.h)}</div><div class="u">${esc(c.url)}</div></div>`).join('')}</div>
  </div>`;
  cards.forEach((c,i)=>drawQR(document.getElementById('q'+i), c.url, 200));
}

/* ================================================================
   啟動
   ================================================================ */
(async function main(){
  const params = readParams();
  const mode = params.get('mode');
  const bar = document.getElementById('demoBar');
  if(!CONFIG.GAS_URL && mode!=='qr'){ bar.textContent = '示範模式：資料只存在這台裝置'; bar.classList.remove('hidden'); }
  try{
    if(mode==='stats') await bootStats();
    else if(mode==='qr') await bootQR();
    else if(mode==='vendor') await bootVendor();
    else await bootPlayer(params);
  }catch(e){
    $app.innerHTML = `<div class="loading">${esc(e.message||'發生錯誤')}<br><br><button class="btn small" onclick="location.reload()">重新載入</button></div>`;
  }
})();
</script>
